version: '3.9'

services:
  frontend:
    build: ./frontend
    container_name: react_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_SERVER_URL=http://103.159.50.207:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
